name: Bootstrap and deploy FALA English

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore FALA source tree when the transfer bundle is present
        run: |
          if compgen -G "bootstrap/fala-source-*.b64" > /dev/null; then
            mkdir -p /tmp/fala-v2
            cat bootstrap/fala-source-*.b64 | base64 --decode > /tmp/fala-v2.zip
            unzip -q /tmp/fala-v2.zip -d /tmp/fala-v2
            cp -a /tmp/fala-v2/fala-superapp/. .
            rm -f bootstrap/fala-source-*.b64
            rmdir bootstrap || true
          else
            echo "Source tree already restored; continuing to build."
          fi

      - name: Commit the restored source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/deploy.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish FALA SuperApp source tree"
            git push origin HEAD:main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
